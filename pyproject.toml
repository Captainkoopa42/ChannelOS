[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "channelos"
version = "0.0.2"
description = "A personal broadcasting system for user-owned media."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
playback = [
    "python-vlc>=3.0.0",
]
ui = [
    "PySide6>=6.8,<7",
]
dev = [
    "pytest>=8,<9",
]
package = [
    "PyInstaller>=6.22,<7",
    "PySide6>=6.8,<7",
    "python-vlc>=3.0.0",
]

[project.scripts]
channelos = "channelos.cli:main"
channelos-couch = "channelos.couch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
channelos = ["qml/*.qml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
